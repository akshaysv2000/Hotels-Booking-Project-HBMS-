<div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center bg-dark text-light">
  <div class="row justify-content-center w-100">
    <div class="col-md-4">
      
      <!-- Modern Glassmorphism Card -->
      <div class="card login-card shadow-lg p-4 border-0 rounded-4">
        <div class="text-center mb-4">
          <span class="badge bg-primary px-3 py-2 rounded-pill">Admin Access</span>
          <h2 class="mt-3 fw-bold text-white">Admin Login</h2>
          
        </div>

        <form (ngSubmit)="onAdminLogin()" #adminForm="ngForm">
          
          <!-- Username -->
          <div class="mb-3">
            <label class="form-label fw-semibold text-white">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-0 text-primary">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" 
                class="form-control custom-input" 
                [(ngModel)]="admin.username" 
                name="username" required placeholder="Enter your  username">
            </div>
          </div>
          
          <!-- Password -->
          <div class="mb-3">
            <label class="form-label fw-semibold text-white">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-0 text-primary">
                <i class="bi bi-lock"></i>
              </span>
              <input [type]="showPassword ? 'text' : 'password'" 
                class="form-control custom-input"
                [(ngModel)]="admin.password"
                name="password" required placeholder="Enter your  password">
              <button type="button"
                class="btn btn-link text-light px-2"
                (click)="togglePassword()">
                <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
              </button>
            </div>
          </div>

          <!-- Login Button -->
          <button class="btn btn-gradient w-100 fw-semibold py-2 rounded-3 mt-3" 
            [disabled]="adminForm.invalid">
            <i class="bi bi-box-arrow-in-right me-2"></i> Login
          </button>

        </form>
      </div>
      
    </div>
  </div>
</div>
