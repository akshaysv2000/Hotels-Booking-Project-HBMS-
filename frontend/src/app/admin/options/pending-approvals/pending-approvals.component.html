<!-- admin-pending-approvals.component.html -->
 <h2 class="page-title mb-4">Pending Hotel Approvals</h2>

<div *ngIf="loading">Loading...</div>
<div *ngIf="!loading && pendingHotels.length === 0">
  <div class="alert alert-info">No pending hotels.</div>
</div>
<div class="d-flex flex-wrap gap-3">
  <div *ngFor="let hotel of pendingHotels" class="card p-3 shadow-sm" style="min-width: 350px;">
    <div><b>Name:</b> {{ hotel.name }}</div>
    <div><b>Address:</b> {{ hotel.address }}</div>
    <div><b>Owner:</b> {{ hotel.ownerName }}</div>
    <div><b>Contact:</b> {{ hotel.contactNumber }}</div>
    <div><b>Status:</b> {{ hotel.status }}</div>
    <div><b>Created:</b> {{ hotel.createdAt | date:'medium' }}</div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-success" (click)="approve(hotel.hotelId)">Approve</button>
      <button class="btn btn-danger" (click)="reject(hotel.hotelId)">Reject</button>
    </div>
  </div>
</div>
