<div class="hotel-profile-container" *ngIf="hotel">
  <h2 class="profile-title">🏨 Hotel Profile</h2>

  <!-- View Mode -->
  <div *ngIf="!editMode; else editSection" class="profile-view">
    <div class="profile-item"><span>Name:</span> {{ hotel.name }}</div>
    <div class="profile-item"><span>Owner:</span> {{ hotel.ownerName }}</div>
    <div class="profile-item"><span>Address:</span> {{ hotel.address }}</div>
    <div class="profile-item"><span>Contact:</span> {{ hotel.contactNumber }}</div>
    <div class="profile-item"><span>Status:</span> {{ hotel.status }}</div>
    <div class="profile-item"><span>Location:</span> {{ hotel.location }}</div>
    <div class="profile-item"><span>Created At:</span> {{ hotel.createdAt | date }}</div>
    <button type="button" class="edit-btn" (click)="enableEdit()">✏️ Edit Profile</button>
  </div>

  <!-- Edit Mode -->
  <ng-template #editSection>
    <form [formGroup]="profileForm" (ngSubmit)="updateProfile()" class="profile-form">
      <div class="form-group">
        <label>Username</label>
        <input formControlName="username" type="text" placeholder="New username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input formControlName="password" type="password" placeholder="New password" />
      </div>
      <div class="form-group">
        <label>Contact Number</label>
        <input formControlName="contactNumber" type="text" />
      </div>
      <div class="btn-group">
        <button type="submit" class="save-btn">💾 Save</button>
        <button type="button" class="cancel-btn" (click)="editMode = false">✖ Cancel</button>
      </div>
    </form>
  </ng-template>

  <div class="msg" *ngIf="updateMsg">{{ updateMsg }}</div>
</div>
